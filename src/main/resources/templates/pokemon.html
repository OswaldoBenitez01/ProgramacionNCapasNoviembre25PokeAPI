<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title th:text="${pokemon.name} + ' | Pokédex'">Pokédex</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
        <style>
            :root {
                --pk-color: #78C850;
                --pk-color2: #78C850;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Press Start 2P', monospace;
                background-color: #1b1b2f;
                background-image:
                    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 40px 40px;
                min-height: 100vh;
                color: #fff;
                overflow-x: hidden;
            }

            .bg-artwork-fixed {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
            }
            .bg-artwork-fixed .bg-blur {
                position: absolute;
                inset: 0;
                background-size: cover;
                background-position: center;
                filter: blur(80px) brightness(0.15) saturate(1.8);
                transform: scale(1.1);
            }
            .bg-artwork-fixed .bg-vignette {
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse at center, transparent 20%, rgba(27,27,47,0.92) 80%);
            }

            .navbar-retro {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 25px;
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(5px);
                border-bottom: 3px solid #333;
                z-index: 2000;
            }
            .logout-btn {
                background: rgba(0,0,0,0.8);
                border: 2px solid #dc3545;
                color: #dc3545;
                padding: 10px 16px;
                font-size: 0.7rem;
                border-radius: 8px;
                cursor: pointer;
                font-family: 'Press Start 2P', monospace;
                box-shadow: 0 0 10px rgba(220,53,69,0.3);
                transition: 0.3s;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }
            .logout-btn:hover {
                background: #dc3545;
                color: #fff;
            }
            .nav-custom-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.7rem;
                border-radius: 8px;
                text-decoration: none;
                border: 2px solid;
                font-family: 'Press Start 2P', monospace;
                transition: all 0.3s ease;
            }
            .back-btn-style {
                background: rgba(0,0,0,0.8);
                border-color: rgba(255,255,255,0.3);
                color: rgba(255,255,255,0.7);
            }
            .back-btn-style:hover {
                background: rgba(255,255,255,0.1);
                color: #fff;
                border-color: #fff;
                cursor: pointer;
            }
            .fav-btn-style {
                background: rgba(0,0,0,0.8);
                border-color: #ff0;
                color: #ff0;
                box-shadow: 0 0 10px rgba(255,255,0,0.3);
            }
            .fav-btn-style:hover {
                background: #ff0;
                color: #000;
                box-shadow: 0 0 20px #ff0;
            }
            .nav-brand {
                font-size: 0.65rem;
                letter-spacing: 3px;
                color: rgba(255,255,255,0.4);
            }
            .nav-brand span {
                color: #fff;
            }

            .page-layout {
                position: relative;
                z-index: 1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                min-height: 100vh;
                padding-top: 62px;
            }
            @media (max-width: 900px) {
                .page-layout {
                    grid-template-columns: 1fr;
                }
                .panel-left  {
                    position: relative;
                    height: auto;
                    padding: 28px 20px 16px;
                    border-right: none;
                    border-bottom: 2px solid #333;
                }
                .panel-right {
                    max-height: none;
                    padding: 20px;
                }
            }

            .panel-left {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                padding: 28px 24px;
                border-right: 2px solid #333;
                overflow: hidden;
            }

            .pk-header {
                width: 100%;
            }
            .pk-id-badge {
                font-size: 0.65rem;
                color: rgba(255,255,255,0.35);
                letter-spacing: 4px;
                margin-bottom: 10px;
            }
            .pk-name-hero {
                font-size: clamp(1.1rem, 2.5vw, 1.7rem);
                text-transform: uppercase;
                letter-spacing: 3px;
                line-height: 1.4;
                text-shadow: 0 0 20px var(--pk-color), 0 0 40px var(--pk-color);
            }
            .pk-types {
                display: flex;
                gap: 8px;
                margin-top: 12px;
                flex-wrap: wrap;
            }
            .type-pill {
                font-size: 0.62rem;
                padding: 7px 16px;
                border-radius: 20px;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                color: #fff;
                font-weight: bold;
                text-shadow: 0 1px 3px rgba(0,0,0,0.7);
                border: 2px solid rgba(255,255,255,0.2);
            }

            .pk-img-wrapper {
                position: relative;
                width: 210px;
                height: 210px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .pk-img-glow {
                position: absolute;
                inset: -10px;
                border-radius: 50%;
                background: radial-gradient(circle, var(--pk-color) 0%, transparent 65%);
                opacity: 0.18;
                animation: glow-pulse 3.5s ease-in-out infinite;
            }
            @keyframes glow-pulse {
                0%,100% {
                    transform: scale(1);
                    opacity: 0.18;
                }
                50%      {
                    transform: scale(1.2);
                    opacity: 0.32;
                }
            }
            .pk-spinner {
                position: absolute;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 5;
            }
            .pk-spinner.active {
                display: flex;
            }
            .spinner-ring {
                width: 52px;
                height: 52px;
                border: 3px solid rgba(255,255,255,0.1);
                border-top-color: var(--pk-color);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            #pokemonImg {
                position: relative;
                z-index: 2;
                width: 190px;
                height: 190px;
                object-fit: contain;
                image-rendering: pixelated;
                filter: drop-shadow(0 10px 28px rgba(0,0,0,0.9)) drop-shadow(0 0 18px var(--pk-color));
                transition: opacity 0.25s ease, filter 0.25s ease;
            }
            #pokemonImg.fading {
                opacity: 0;
                filter: brightness(2) blur(6px);
            }

            .sprite-controls-row {
                width: 100%;
                display: flex;
                gap: 6px;
            }
            .ctrl-btn {
                flex: 1;
                background: rgba(0,0,0,0.5);
                border: 2px solid rgba(255,255,255,0.15);
                border-radius: 8px;
                padding: 11px 4px 9px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                cursor: pointer;
                transition: all 0.2s;
                color: rgba(255,255,255,0.5);
                font-family: 'Press Start 2P', monospace;
                min-width: 0;
            }
            .ctrl-btn i    {
                font-size: 1.1rem;
            }
            .ctrl-btn span {
                font-size: 0.42rem;
                letter-spacing: 0.5px;
                white-space: nowrap;
            }
            .ctrl-btn:hover {
                background: rgba(255,255,255,0.08);
                color: #fff;
                border-color: rgba(255,255,255,0.4);
            }
            .ctrl-btn.active-shiny  {
                border-color: #ff0;
                color: #ff0;
                background: rgba(255,255,0,0.08);
                box-shadow: 0 0 10px rgba(255,255,0,0.3);
            }
            .ctrl-btn.active-female {
                border-color: #e84393;
                color: #e84393;
                background: rgba(232,67,147,0.08);
            }
            .ctrl-btn.active-gif    {
                border-color: var(--pk-color);
                color: var(--pk-color);
                background: rgba(120,200,80,0.08);
                box-shadow: 0 0 10px rgba(120,200,80,0.25);
            }
            .ctrl-btn.active-flip   {
                border-color: #00f7ff;
                color: #00f7ff;
                background: rgba(0,247,255,0.08);
            }
            .ctrl-btn.hidden-ctrl   {
                display: none;
            }

            .cry-btn {
                width: 100%;
                background: rgba(0,0,0,0.5);
                border: 2px solid rgba(255,255,255,0.15);
                border-radius: 8px;
                padding: 11px 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                cursor: pointer;
                transition: all 0.2s;
                color: rgba(255,255,255,0.55);
                font-family: 'Press Start 2P', monospace;
                font-size: 0.55rem;
            }
            .cry-btn i {
                font-size: 1.1rem;
            }
            .cry-btn:hover {
                background: rgba(255,255,255,0.08);
                color: #fff;
                border-color: rgba(255,255,255,0.4);
            }

            .pk-quick-stats {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                border: 2px solid #333;
                border-radius: 10px;
                overflow: hidden;
            }
            .qs-item {
                padding: 11px 4px;
                text-align: center;
                background: rgba(0,0,0,0.4);
                border-right: 1px solid #333;
            }
            .qs-item:last-child {
                border-right: none;
            }
            .qs-label {
                font-size: 0.4rem;
                color: rgba(255,255,255,0.3);
                display: block;
                margin-bottom: 7px;
                letter-spacing: 1px;
            }
            .qs-value {
                font-size: 0.62rem;
                color: #fff;
            }

            .panel-right {
                padding: 28px 28px 40px 24px;
                overflow-y: auto;
                max-height: calc(100vh - 62px);
                scrollbar-width: thin;
                scrollbar-color: #333 transparent;
            }

            .pk-tabs {
                display: flex;
                width: 100%;
                gap: 4px;
                margin-bottom: 28px;
                background: rgba(0,0,0,0.5);
                border-radius: 10px;
                padding: 4px;
                border: 2px solid #333;
            }
            .pk-tab {
                flex: 1;
                font-family: 'Press Start 2P', monospace;
                font-size: 0.52rem;
                padding: 12px 6px;
                border: 2px solid transparent;
                border-radius: 7px;
                cursor: pointer;
                color: rgba(255,255,255,0.35);
                background: transparent;
                transition: all 0.2s;
                letter-spacing: 0.5px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                white-space: nowrap;
            }
            .pk-tab i {
                font-size: 0.85rem;
            }
            .pk-tab:hover {
                color: rgba(255,255,255,0.7);
                background: rgba(255,255,255,0.04);
            }
            .pk-tab.active {
                color: #fff;
                background: rgba(255,255,255,0.08);
                border-color: #444;
            }

            .tab-panel {
                display: none;
                animation: fadeIn 0.2s ease;
            }
            .tab-panel.active {
                display: block;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(5px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .section-title {
                font-size: 0.6rem;
                letter-spacing: 2px;
                color: rgba(255,255,255,0.3);
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                gap: 10px;
                text-transform: uppercase;
            }
            .section-title i {
                color: var(--pk-color);
                font-size: 1rem;
            }
            .section-title::after {
                content: '';
                flex: 1;
                height: 1px;
                background: #333;
            }

            .stat-row {
                display: grid;
                grid-template-columns: 130px 1fr 50px;
                align-items: center;
                gap: 12px;
                margin-bottom: 14px;
            }
            .stat-label {
                font-size: 0.5rem;
                text-transform: uppercase;
                color: rgba(255,255,255,0.4);
                letter-spacing: 1px;
            }
            .stat-track {
                height: 9px;
                background: rgba(255,255,255,0.06);
                border-radius: 5px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.05);
            }
            .stat-fill {
                height: 100%;
                border-radius: 5px;
                width: 0%;
                background: linear-gradient(90deg, var(--pk-color), var(--pk-color2));
                transition: width 1.3s cubic-bezier(0.4,0,0.2,1);
            }
            .stat-num {
                font-size: 0.55rem;
                color: rgba(255,255,255,0.8);
                text-align: right;
            }
            .stat-total-row {
                border-top: 2px solid #333;
                padding-top: 14px;
                margin-top: 6px;
            }
            .stat-total-row .stat-label {
                color: rgba(255,255,255,0.65);
            }
            .stat-total-row .stat-num   {
                color: #fff;
            }

            .ability-card {
                background: rgba(0,0,0,0.4);
                border: 2px solid #333;
                border-radius: 10px;
                padding: 16px 18px;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                gap: 14px;
                transition: all 0.2s;
            }
            .ability-card:hover {
                border-color: #555;
                background: rgba(255,255,255,0.04);
                transform: translateX(3px);
            }
            .ability-icon {
                width: 42px;
                height: 42px;
                border-radius: 8px;
                background: rgba(0,0,0,0.5);
                border: 2px solid #444;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.1rem;
                flex-shrink: 0;
                color: var(--pk-color);
            }
            .ability-name {
                font-size: 0.58rem;
                text-transform: capitalize;
                color: #fff;
                letter-spacing: 1px;
            }
            .ability-slot {
                font-size: 0.44rem;
                color: rgba(255,255,255,0.25);
                margin-top: 7px;
            }
            .badge-hidden {
                margin-left: auto;
                font-size: 0.44rem;
                background: rgba(255,255,0,0.1);
                border: 2px solid rgba(255,255,0,0.5);
                color: #ff0;
                padding: 5px 11px;
                border-radius: 6px;
                white-space: nowrap;
            }
            .badge-normal-ab {
                margin-left: auto;
                font-size: 0.44rem;
                background: rgba(255,255,255,0.03);
                border: 2px solid #333;
                color: rgba(255,255,255,0.3);
                padding: 5px 11px;
                border-radius: 6px;
                white-space: nowrap;
            }

            .moves-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }
            .moves-counter-badge {
                font-size: 0.48rem;
                background: rgba(0,0,0,0.5);
                border: 2px solid #333;
                color: rgba(255,255,255,0.35);
                padding: 5px 12px;
                border-radius: 20px;
            }
            .moves-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                max-height: 450px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: #333 transparent;
            }
            .move-chip {
                background: rgba(0,0,0,0.4);
                border: 2px solid #333;
                border-radius: 8px;
                padding: 11px 13px;
                font-size: 0.46rem;
                text-transform: capitalize;
                color: rgba(255,255,255,0.6);
                letter-spacing: 0.5px;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 9px;
            }
            .move-chip i {
                color: var(--pk-color);
                font-size: 0.7rem;
                flex-shrink: 0;
            }
            .move-chip:hover {
                border-color: #555;
                color: #fff;
                background: rgba(255,255,255,0.05);
            }

            .sprites-gallery {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
            @media (max-width: 500px) {
                .sprites-gallery {
                    grid-template-columns: repeat(3, 1fr);
                }
            }
            .sprite-thumb {
                background: rgba(0,0,0,0.4);
                border: 2px solid #333;
                border-radius: 10px;
                padding: 13px 6px 9px;
                text-align: center;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 7px;
            }
            .sprite-thumb:hover {
                border-color: var(--pk-color);
                background: rgba(255,255,255,0.04);
                transform: translateY(-2px);
                box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            }
            .sprite-thumb img {
                width: 62px;
                height: 62px;
                object-fit: contain;
                image-rendering: pixelated;
            }
            .sprite-thumb-label {
                font-size: 0.4rem;
                color: rgba(255,255,255,0.3);
                letter-spacing: 0.5px;
            }
        </style>
    </head>
    <body>

        <div class="bg-artwork-fixed">
            <div class="bg-blur" id="bgArtwork"></div>
            <div class="bg-vignette"></div>
        </div>

        <nav class="navbar-retro">
            <button id="backBtn" class="nav-custom-btn back-btn-style">
                <i class="bi bi-arrow-left"></i> ATRAS
            </button>
            <span class="nav-brand">&#x25B6; <span>POKEDEX</span></span>
            <div style="display:flex; gap:10px; align-items:center;">
                <a sec:authorize="hasRole('Usuario')"
                   th:href="@{/pokemon/favoritos}"
                   class="nav-custom-btn fav-btn-style">
                    <i class="bi bi-heart-fill"></i> FAVORITOS
                </a>
                <form th:action="@{/logout}" method="post" style="margin:0">
                    <button type="submit" class="logout-btn">
                        <i class="bi bi-box-arrow-right"></i> SALIR
                    </button>
                </form>
            </div>
        </nav>

        <div class="page-layout">

            <div class="panel-left">

                <div class="pk-header">
                    <div class="pk-id-badge" th:text="'No. ' + ${pokemon.id}">001</div>
                    <h1 class="pk-name-hero" th:text="${pokemon.name}">BULBASAUR</h1>
                    <div class="pk-types">
                        <span th:each="type, i : ${pokemon.types}"
                              th:text="${type.type.name}"
                              th:style="'background:' + ${coloresTipos[i.index]} + '; box-shadow:0 0 10px ' + ${coloresTipos[i.index]} + '55'"
                              class="type-pill">
                        </span>
                    </div>
                </div>

                <div class="pk-img-wrapper">
                    <div class="pk-img-glow"></div>
                    <div class="pk-spinner" id="pkSpinner">
                        <div class="spinner-ring"></div>
                    </div>
                    <img id="pokemonImg"
                         th:src="${pokemon.sprites.other?.showdown?.frontDefault} ?: ${pokemon.sprites.frontDefault}"
                         alt="pokemon"
                         onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'">
                </div>

                <div class="sprite-controls-row">
                    <button class="ctrl-btn" id="btnFlip" onclick="cambiarSprite()">
                        <i class="bi bi-arrow-repeat"></i>
                        <span>VOLTEAR</span>
                    </button>
                    <button class="ctrl-btn hidden-ctrl" id="btnShiny" onclick="toggleShiny()">
                        <i class="bi bi-stars"></i>
                        <span>SHINY</span>
                    </button>
                    <button class="ctrl-btn hidden-ctrl" id="btnGenero" onclick="toggleGenero()">
                        <i class="bi bi-gender-female"></i>
                        <span>FEMALE</span>
                    </button>
                    <button class="ctrl-btn hidden-ctrl" id="btnGif" onclick="toggleGif()">
                        <i class="bi bi-play-fill"></i>
                        <span>ANIM</span>
                    </button>
                </div>

                <button class="cry-btn" onclick="Sonido()">
                    <i class="bi bi-volume-up-fill"></i>
                    REPRODUCIR CRY
                </button>

                <div class="pk-quick-stats">
                    <div class="qs-item">
                        <span class="qs-label">PESO</span>
                        <span class="qs-value" th:text="${pokemon.weight / 10.0} + 'kg'">—</span>
                    </div>
                    <div class="qs-item">
                        <span class="qs-label">ALTURA</span>
                        <span class="qs-value" th:text="${pokemon.height / 10.0} + 'm'">—</span>
                    </div>
                    <div class="qs-item">
                        <span class="qs-label">EXP</span>
                        <span class="qs-value" th:text="${pokemon.baseExperience}">—</span>
                    </div>
                    <div class="qs-item">
                        <span class="qs-label">TOTAL</span>
                        <span class="qs-value" th:text="${totalStats}">—</span>
                    </div>
                </div>

            </div>

            <div class="panel-right">

                <div class="pk-tabs">
                    <button class="pk-tab active" onclick="switchTab('stats', this)">
                        <i class="bi bi-bar-chart-fill"></i> STATS
                    </button>
                    <button class="pk-tab" onclick="switchTab('skills', this)">
                        <i class="bi bi-lightning-charge-fill"></i> SKILLS
                    </button>
                    <button class="pk-tab" onclick="switchTab('moves', this)">
                        <i class="bi bi-crosshair"></i> MOVES
                    </button>
                    <button class="pk-tab" onclick="switchTab('galeria', this)">
                        <i class="bi bi-images"></i> SPRITES
                    </button>
                </div>

                <div id="tab-stats" class="tab-panel active">
                    <p class="section-title"><i class="bi bi-bar-chart-fill"></i> BASE STATS</p>
                    <div th:each="stat : ${pokemon.stats}" class="stat-row">
                        <div class="stat-label" th:text="${stat.stat.name}">hp</div>
                        <div class="stat-track">
                            <div class="stat-fill" th:attr="data-width=${stat.baseStat * 100 / 255}"></div>
                        </div>
                        <div class="stat-num" th:text="${stat.baseStat}">0</div>
                    </div>
                    <div class="stat-row stat-total-row">
                        <div class="stat-label">TOTAL</div>
                        <div class="stat-track">
                            <div class="stat-fill"
                                 th:attr="data-width=${totalStats * 100 / 720}"
                                 style="background: rgba(255,255,255,0.45) !important;"></div>
                        </div>
                        <div class="stat-num" th:text="${totalStats}">0</div>
                    </div>
                </div>

                <div id="tab-skills" class="tab-panel">
                    <p class="section-title"><i class="bi bi-lightning-charge-fill"></i> HABILIDADES</p>
                    <div th:each="ability : ${pokemon.abilities}" class="ability-card">
                        <div class="ability-icon">
                            <i th:if="${!ability.hidden}" class="bi bi-lightning-charge-fill"></i>
                            <i th:if="${ability.hidden}"  class="bi bi-eye-fill"></i>
                        </div>
                        <div>
                            <div class="ability-name" th:text="${ability.ability.name}">—</div>
                            <div class="ability-slot" th:text="'Slot ' + ${ability.slot}">Slot 1</div>
                        </div>
                        <span th:if="${ability.hidden}"  class="badge-hidden">OCULTA</span>
                        <span th:if="${!ability.hidden}" class="badge-normal-ab">NORMAL</span>
                    </div>
                </div>

                <div id="tab-moves" class="tab-panel">
                    <div class="moves-header">
                        <p class="section-title" style="margin-bottom:0">
                            <i class="bi bi-crosshair"></i> MOVIMIENTOS
                        </p>
                        <span class="moves-counter-badge" th:text="${pokemon.moves.length} + ' MOVES'"></span>
                    </div>
                    <div class="moves-grid">
                        <div th:each="move : ${pokemon.moves}" class="move-chip">
                            <i class="bi bi-caret-right-fill"></i>
                            <span th:text="${move.move.name}"></span>
                        </div>
                    </div>
                </div>

                <div id="tab-galeria" class="tab-panel">
                    <p class="section-title"><i class="bi bi-images"></i> GALERIA DE SPRITES</p>
                    <div class="sprites-gallery">

                        <div th:if="${pokemon.sprites.other?.officialArtwork?.frontDefault != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.other.officialArtwork.frontDefault},data-pixel='false'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.other.officialArtwork.frontDefault}" style="image-rendering:auto" alt="artwork">
                            <div class="sprite-thumb-label">OFICIAL</div>
                        </div>

                        <div th:if="${pokemon.sprites.other?.officialArtwork?.frontShiny != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.other.officialArtwork.frontShiny},data-pixel='false'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.other.officialArtwork.frontShiny}" style="image-rendering:auto" alt="shiny">
                            <div class="sprite-thumb-label">SHINY OFICIAL</div>
                        </div>

                        <div th:if="${pokemon.sprites.other?.home?.frontDefault != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.other.home.frontDefault},data-pixel='false'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.other.home.frontDefault}" style="image-rendering:auto" alt="home">
                            <div class="sprite-thumb-label">HOME</div>
                        </div>

                        <div th:if="${pokemon.sprites.other?.dreamWorld?.frontDefault != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.other.dreamWorld.frontDefault},data-pixel='false'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.other.dreamWorld.frontDefault}" style="image-rendering:auto" alt="dream">
                            <div class="sprite-thumb-label">DREAM WORLD</div>
                        </div>

                        <div th:if="${pokemon.sprites.other?.showdown?.frontDefault != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.other.showdown.frontDefault},data-pixel='true'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.other.showdown.frontDefault}" alt="battle">
                            <div class="sprite-thumb-label">BATTLE</div>
                        </div>

                        <div th:if="${pokemon.sprites.other?.showdown?.frontShiny != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.other.showdown.frontShiny},data-pixel='true'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.other.showdown.frontShiny}" alt="battle shiny">
                            <div class="sprite-thumb-label">BATTLE SHINY</div>
                        </div>

                        <div th:if="${pokemon.sprites.frontDefault != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.frontDefault},data-pixel='true'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.frontDefault}" alt="front">
                            <div class="sprite-thumb-label">FRONT</div>
                        </div>

                        <div th:if="${pokemon.sprites.backDefault != null}"
                             class="sprite-thumb"
                             th:attr="data-src=${pokemon.sprites.backDefault},data-pixel='true'"
                             onclick="thumbClick(this)">
                            <img th:src="${pokemon.sprites.backDefault}" alt="back">
                            <div class="sprite-thumb-label">BACK</div>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <script th:inline="javascript">
            const tipoColor1 = /*[[${coloresTipos[0]}]]*/ '#78C850';
            const tipoColor2 = /*[[${coloresTipos.size() > 1 ? coloresTipos[1] : coloresTipos[0]}]]*/ '#78C850';

            function solidFrom(c) {
                if (!c)
                    return '#78C850';
                const m = c.match(/#[a-fA-F0-9]{6}/);
                return m ? m[0] : c;
            }
            const c1 = solidFrom(tipoColor1);
            const c2 = solidFrom(tipoColor2);
            document.documentElement.style.setProperty('--pk-color', c1);
            document.documentElement.style.setProperty('--pk-color2', c2);
            document.querySelectorAll('.stat-fill:not([style*="important"])').forEach(bar => {
                bar.style.background = `linear-gradient(90deg, ${c1}, ${c2})`;
            });

            const audioUrl = /*[[${pokemon.cries.latest}]]*/ '';
            const pokemonAudio = new Audio(audioUrl);
            function Sonido() {
                pokemonAudio.currentTime = 0;
                pokemonAudio.play().catch(e => console.warn('Audio bloqueado:', e));
            }

            const SP = {
                front: /*[[${pokemon.sprites.frontDefault}                         ?: '']]*/ '',
                back: /*[[${pokemon.sprites.backDefault}                          ?: '']]*/ '',
                frontShiny: /*[[${pokemon.sprites.frontShiny}                           ?: '']]*/ '',
                backShiny: /*[[${pokemon.sprites.backShiny}                            ?: '']]*/ '',
                frontFem: /*[[${pokemon.sprites.frontFemale}                          ?: '']]*/ '',
                backFem: /*[[${pokemon.sprites.backFemale}                           ?: '']]*/ '',
                frontShinyFem: /*[[${pokemon.sprites.frontShinyFemale}                     ?: '']]*/ '',
                backShinyFem: /*[[${pokemon.sprites.backShinyFemale}                      ?: '']]*/ '',
                gifFront: /*[[${pokemon.sprites.other?.showdown?.frontDefault}        ?: '']]*/ '',
                gifBack: /*[[${pokemon.sprites.other?.showdown?.backDefault}         ?: '']]*/ '',
                gifShiny: /*[[${pokemon.sprites.other?.showdown?.frontShiny}          ?: '']]*/ '',
                gifShinyBack: /*[[${pokemon.sprites.other?.showdown?.backShiny}           ?: '']]*/ '',
                artwork: /*[[${pokemon.sprites.other?.officialArtwork?.frontDefault} ?: '']]*/ ''
            };

            if (SP.artwork)
                document.getElementById('bgArtwork').style.backgroundImage = `url(${SP.artwork})`;

            let esShiny = false, mostrandoFront = true, esFemenino = false, usandoGif = true;

            function resolverSprite() {
                if (usandoGif && SP.gifFront) {
                    if (esShiny && SP.gifShiny)
                        return mostrandoFront ? SP.gifShiny : (SP.gifShinyBack || SP.gifShiny);
                    return mostrandoFront ? SP.gifFront : (SP.gifBack || SP.gifFront);
                }
                if (esFemenino && SP.frontFem) {
                    if (esShiny && SP.frontShinyFem)
                        return mostrandoFront ? SP.frontShinyFem : (SP.backShinyFem || SP.frontShinyFem);
                    return mostrandoFront ? SP.frontFem : (SP.backFem || SP.frontFem);
                }
                if (esShiny && SP.frontShiny)
                    return mostrandoFront ? SP.frontShiny : (SP.backShiny || SP.frontShiny);
                return mostrandoFront ? SP.front : (SP.back || SP.front);
            }

            function aplicarSprite() {
                const img = document.getElementById('pokemonImg');
                const spinner = document.getElementById('pkSpinner');
                const src = resolverSprite();
                if (!src)
                    return;
                img.classList.add('fading');
                spinner.classList.add('active');
                setTimeout(() => {
                    const tmp = new Image();
                    tmp.onload = () => {
                        img.src = src;
                        img.classList.remove('fading');
                        spinner.classList.remove('active');
                    };
                    tmp.onerror = () => {
                        img.classList.remove('fading');
                        spinner.classList.remove('active');
                    };
                    tmp.src = src;
                }, 220);
            }

            function cambiarSprite() {
                mostrandoFront = !mostrandoFront;
                document.getElementById('btnFlip').classList.toggle('active-flip', !mostrandoFront);
                aplicarSprite();
            }
            function toggleShiny() {
                esShiny = !esShiny;
                document.getElementById('btnShiny').classList.toggle('active-shiny', esShiny);
                aplicarSprite();
            }
            function toggleGenero() {
                esFemenino = !esFemenino;
                document.getElementById('btnGenero').classList.toggle('active-female', esFemenino);
                aplicarSprite();
            }
            function toggleGif() {
                usandoGif = !usandoGif;
                document.getElementById('btnGif').classList.toggle('active-gif', usandoGif);
                aplicarSprite();
            }

            if (SP.frontShiny || SP.gifShiny)
                document.getElementById('btnShiny').classList.remove('hidden-ctrl');
            if (SP.frontFem)
                document.getElementById('btnGenero').classList.remove('hidden-ctrl');
            if (SP.gifFront) {
                document.getElementById('btnGif').classList.remove('hidden-ctrl');
                document.getElementById('btnGif').classList.add('active-gif');
            }

            function thumbClick(el) {
                usandoGif = false;
                document.getElementById('btnGif').classList.remove('active-gif');
                const img = document.getElementById('pokemonImg');
                const spinner = document.getElementById('pkSpinner');
                img.classList.add('fading');
                spinner.classList.add('active');
                setTimeout(() => {
                    const tmp = new Image();
                    tmp.onload = () => {
                        img.src = el.dataset.src;
                        img.style.imageRendering = el.dataset.pixel === 'true' ? 'pixelated' : 'auto';
                        img.classList.remove('fading');
                        spinner.classList.remove('active');
                    };
                    tmp.src = el.dataset.src;
                }, 220);
            }

            function switchTab(name, btn) {
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.pk-tab').forEach(b => b.classList.remove('active'));
                document.getElementById('tab-' + name).classList.add('active');
                btn.classList.add('active');
                if (name === 'stats')
                    animarBarras();
            }

            function animarBarras() {
                document.querySelectorAll('.stat-fill').forEach(bar => {
                    bar.style.width = '0%';
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                            bar.style.width = (bar.dataset.width || 0) + '%';
                        }));
                });
            }
            window.addEventListener('load', () => setTimeout(animarBarras, 400));

            document.getElementById('backBtn').addEventListener('click', () => {
                window.history.length > 1 ? window.history.back() : window.location.href = '/';
            });
        </script>
    </body>
</html>
