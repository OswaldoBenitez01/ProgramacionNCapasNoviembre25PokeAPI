<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Recuperar Contraseña</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Press Start 2P', monospace !important;
            }

            body {
                background-color: #1b1b2f;
                background-image:
                    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 40px 40px;
                min-height: 100vh;
                padding: 60px 20px;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .login-container {
                max-width: 480px;
                width: 100%;
            }

            .login-header {
                text-align: center;
                margin-bottom: 50px;
            }

            .login-header h1 {
                font-size: clamp(1rem, 3.5vw, 1.5rem); /* Un poco más pequeño por el texto largo */
                color: #fff;
                text-shadow:
                    0 0 10px #ff0,
                    0 0 20px #ff0,
                    0 0 40px #f80;
                letter-spacing: 2px;
                margin-bottom: 12px;
                line-height: 1.5;
            }

            .login-header p {
                font-size: 0.5rem;
                color: #aaa;
                letter-spacing: 1px;
                line-height: 1.6;
            }

            .alert-custom {
                border: 2px solid #ff0;
                background: rgba(255,255,0,0.12);
                color: #ff0;
                text-shadow: 0 0 8px #ff0;
                padding: 20px;
                border-radius: 12px;
                margin-bottom: 35px;
                backdrop-filter: blur(15px);
                box-shadow: 0 0 25px rgba(255,255,0,0.25);
                font-size: 0.6rem;
                text-align: center;
            }

            .alert-error {
                border-color: #f66;
                background: rgba(255,102,102,0.12);
                color: #f66;
                text-shadow: 0 0 8px #f66;
            }

            .form-group {
                margin-bottom: 35px;
            }

            .form-label {
                display: block;
                font-size: 0.65rem;
                color: #ccc;
                margin-bottom: 14px;
                text-transform: uppercase;
                letter-spacing: 1.5px;
            }

            .input-group-custom {
                background: rgba(13,13,26,0.95);
                border: 2px solid rgba(255,255,255,0.12);
                border-radius: 10px;
                height: 60px;
                display: flex;
                align-items: center;
                transition: all 0.3s ease;
            }

            .input-group-custom:focus-within {
                border-color: #ff0;
                box-shadow: 0 0 25px rgba(255,255,0,0.4);
            }

            .input-group-text-custom {
                background: transparent;
                border: none;
                border-right: 2px solid rgba(255,255,255,0.12);
                color: #888;
                width: 55px;
                display: flex;
                justify-content: center;
            }

            .form-control-custom {
                background: transparent;
                border: none;
                color: #fff;
                padding: 0 20px;
                font-size: 0.85rem;
                flex: 1;
            }

            .form-control-custom:focus { outline: none; color: #fff; }

            .btn-custom {
                width: 100%;
                padding: 18px 24px;
                font-size: 0.7rem;
                border-radius: 10px;
                text-transform: uppercase;
                letter-spacing: 2px;
                transition: all 0.3s ease;
                border: none;
                cursor: pointer;
                display: block;
                text-align: center;
                margin-bottom: 14px;
                text-decoration: none !important;
            }

            .btn-reset {
                background: linear-gradient(145deg, #007bff, #00d4ff);
                color: #fff;
                box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            }

            .btn-reset:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(0, 123, 255, 0.5);
            }

            .btn-back {
                background: transparent;
                border: 2px solid #aaa;
                color: #aaa;
            }

            .btn-back:hover {
                border-color: #fff;
                color: #fff;
                background: rgba(255,255,255,0.05);
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="login-header">
                <h1>RECUPERAR CONTRASEÑA</h1>
                <p>Ingresa tu correo para enviarte un enlace de restauración.</p>
            </div>

            <div th:if="${success}" class="alert-custom" role="alert">
                <i class="bi bi-send-check-fill me-2"></i>
                <span th:text="${success}">¡Enlace enviado! Revisa tu bandeja.</span>
            </div>

            <div th:if="${error}" class="alert-custom alert-error" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">El correo no está registrado en la base.</span>
            </div>

            <form th:action="@{/recuperacion}" method="post">
                <div class="form-group">
                    <label class="form-label" for="email">CORREO DE ENTRENADOR</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text-custom">
                            <i class="bi bi-envelope-at-fill"></i>
                        </span>
                        <input type="email" class="form-control-custom" id="email" name="email" 
                               placeholder="tu-correo@ejemplo.com" required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn-custom btn-reset">
                        <i class="bi bi-lightning-fill me-2"></i>
                        Enviar correo
                    </button>
                    
                    <a th:href="@{/login}" class="btn-custom btn-back">
                        <i class="bi bi-arrow-left-circle-fill me-2"></i>
                        Volver al inicio
                    </a>
                </div>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
