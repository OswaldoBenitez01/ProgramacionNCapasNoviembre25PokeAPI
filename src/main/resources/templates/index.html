<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>Pokédex</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: 'Press Start 2P', monospace;
                background-color: #1b1b2f;
                background-image:
                    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 40px 40px;
                min-height: 100vh;
                padding: 90px 20px 30px;
                color: #fff;
            }

            .navbar-retro {
                position: fixed; top: 0; left: 0; width: 100%;
                display: flex; justify-content: space-between; align-items: center;
                padding: 15px 25px;
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(5px);
                border-bottom: 3px solid #333;
                z-index: 2000;
            }
            .logout-btn {
                background: rgba(0,0,0,0.8); border: 2px solid #dc3545; color: #dc3545;
                padding: 10px 16px; font-size: 0.7rem; border-radius: 8px; cursor: pointer;
                font-family: 'Press Start 2P', monospace;
                box-shadow: 0 0 10px rgba(220,53,69,0.3); transition: 0.3s;
            }
            .logout-btn:hover { background: #dc3545; color: #fff; }
            .nav-custom-btn {
                display: flex; align-items: center; gap: 8px;
                padding: 10px 16px; font-size: 0.65rem; border-radius: 8px;
                text-decoration: none; border: 2px solid #ff0;
                font-family: 'Press Start 2P', monospace; transition: all 0.3s ease;
            }
            .fav-btn-style { background: rgba(0,0,0,0.8); color: #ff0; box-shadow: 0 0 10px rgba(255,255,0,0.3); }
            .fav-btn-style:hover { background: #ff0; color: #000; box-shadow: 0 0 20px #ff0; }

            .header { text-align: center; margin-bottom: 24px; }
            .header h1 {
                font-size: clamp(1.2rem, 4vw, 2rem); color: #fff;
                text-shadow: 0 0 10px #ff0, 0 0 20px #ff0, 0 0 40px #f80;
                letter-spacing: 4px; cursor: pointer; transition: all 0.2s ease;
            }
            .header h1:hover { text-shadow: 0 0 20px #ff0, 0 0 40px #ff0, 0 0 60px #f80; }

            .filters-bar {
                max-width: 1400px; margin: 0 auto 20px;
                display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            }
            .filters-bar label { font-size: 0.5rem; color: #aaa; white-space: nowrap; }
            .filters-bar select {
                background: #0d0d1a; border: 2px solid rgba(255,255,255,0.15); color: #fff;
                padding: 6px 10px; font-family: 'Press Start 2P', monospace;
                font-size: 0.55rem; border-radius: 8px; height: 36px; transition: border-color 0.2s;
            }
            .filters-bar select:focus { border-color: #ff0; outline: none; }
            .filters-bar select option { background: #1b1b2f; }
            .search-input {
                background: #0d0d1a; border: 2px solid rgba(255,255,255,0.15); color: #fff;
                padding: 6px 10px; font-family: 'Press Start 2P', monospace;
                font-size: 0.55rem; border-radius: 8px; height: 36px;
                width: 140px; transition: border-color 0.2s; outline: none;
            }
            .search-input:focus { border-color: #ff0; box-shadow: 0 0 8px rgba(255,255,0,0.3); }
            .search-input::placeholder { color: #555; }
            .filter-bar-btn {
                height: 36px; padding: 0 14px;
                font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
                border-radius: 8px; cursor: pointer; border: 2px solid;
                transition: all 0.2s; white-space: nowrap; background: transparent;
            }
            .filter-bar-btn.apply { border-color: #28a745; color: #28a745; }
            .filter-bar-btn.apply:hover { background: #28a745; color: #fff; }
            .filter-bar-btn.clear  { border-color: #dc3545; color: #dc3545; }
            .filter-bar-btn.clear:hover  { background: #dc3545; color: #fff; }

            .filter-chips { max-width: 1400px; margin: 0 auto 20px; display: flex; gap: 12px; flex-wrap: wrap; }
            .chip {
                background: linear-gradient(145deg, rgba(255,255,0,0.2), rgba(255,165,0,0.1));
                border: 2px solid #ff0; padding: 8px 14px; border-radius: 25px;
                font-size: 0.6rem; cursor: pointer; display: flex; align-items: center;
                gap: 6px; transition: all 0.3s; color: #fff;
            }
            .chip:hover { background: linear-gradient(145deg, #ff0, #ff8c00); color: #000; }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 30px;
                max-width: 1400px;
                margin: 0 auto 40px;
            }

            .card-container {
                height: 320px;
                perspective: 900px;
                cursor: pointer;
                user-select: none;
            }
            .card-inner {
                position: relative;
                width: 100%; height: 100%;
                transform-style: preserve-3d;
            }
            .card-face {
                position: absolute;
                width: 100%; height: 100%;
                border-radius: 14px;
                padding: 14px;
                display: flex;
                flex-direction: column;
            }
            .card-front {
                border: 2px solid rgba(255,255,255,0.18);
                box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.2);
                justify-content: space-between;
                visibility: visible;
            }
            .card-back {
                background: #0e0e24;
                border: 2px solid rgba(255,255,255,0.1);
                justify-content: space-between;
                transform: rotateY(180deg);
                visibility: hidden;
            }

            .front-top { display: flex; justify-content: space-between; align-items: flex-start; }
            .poke-name {
                font-size: 0.62rem; text-transform: uppercase;
                text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
                max-width: 110px; word-break: break-word; line-height: 1.6;
            }
            .poke-id {
                font-size: 0.48rem; background: rgba(0,0,0,0.5);
                padding: 4px 7px; border-radius: 6px;
            }
            .front-sprite {
                flex: 1;
                position: relative;
                display: flex; align-items: center; justify-content: center;
            }
            .front-sprite img {
                width: 82%; height: 82%;
                image-rendering: pixelated;
                filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.7));
                pointer-events: none;
                transition: filter 0.3s ease;
            }
            .btn-detail-front {
                position: absolute;
                bottom: 6px;
                left: 50%;
                transform: translateX(-50%);
                display: flex; align-items: center; gap: 6px;
                background: rgba(0,0,0,0.65);
                border: 1px solid rgba(255,255,255,0.3);
                border-radius: 20px;
                padding: 6px 14px;
                font-family: 'Press Start 2P', monospace;
                font-size: 0.42rem;
                color: rgba(255,255,255,0.85);
                text-decoration: none;
                white-space: nowrap;
                z-index: 2;
                transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
                letter-spacing: 1px;
            }
            .btn-detail-front:hover {
                background: rgba(255,255,255,0.2);
                border-color: #fff; color: #fff;
                box-shadow: 0 0 12px rgba(255,255,255,0.4);
            }
            .front-bottom { display: flex; flex-direction: column; gap: 8px; }
            .poke-types { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
            .type-badge {
                font-size: 0.52rem; padding: 5px 11px; border-radius: 20px;
                text-transform: uppercase; letter-spacing: 1px;
                color: #fff; font-weight: bold;
                text-shadow: 0 1px 3px rgba(0,0,0,0.7); border: none;
            }
            .hp-hearts { display: flex; align-items: center; gap: 7px; justify-content: center; }
            .hp-hearts-label { font-size: 0.5rem; color: rgba(255,255,255,0.7); letter-spacing: 1px; }
            .hearts-row { display: flex; gap: 4px; align-items: center; }
            .heart { font-size: 0.9rem; transition: opacity 0.2s, transform 0.2s; }
            .heart.full  { opacity: 1; transform: scale(1.1); }
            .heart.empty { opacity: 0.18; }

            .back-header {
                display: flex; justify-content: space-between; align-items: center; gap: 6px;
            }
            .back-title {
                font-size: 0.46rem; text-transform: uppercase; color: #fff;
                flex-shrink: 0; max-width: 85px; word-break: break-word; line-height: 1.5;
            }
            .capture-counter {
                display: flex; align-items: center; gap: 5px;
                background: rgba(0,0,0,0.4); border-radius: 8px;
                padding: 5px 8px; border: 1px solid rgba(255,255,255,0.08);
                transition: border-color 0.3s, box-shadow 0.3s; flex-shrink: 0;
            }
            .pokeball-icon { width: 14px; height: 14px; flex-shrink: 0; transition: opacity 0.3s, filter 0.3s; }
            .counter-label { font-size: 0.32rem; color: rgba(255,255,255,0.4); letter-spacing: 1px; }
            .counter-num   { font-size: 0.45rem; font-weight: bold; transition: color 0.3s, text-shadow 0.3s; }
            .capture-counter.dim .pokeball-icon { opacity: 0.2; filter: grayscale(1); }
            .capture-counter.dim .counter-num   { color: rgba(255,255,255,0.2); text-shadow: none; }
            .capture-counter.dim .counter-label { color: rgba(255,255,255,0.2); }
            .capture-counter.lit { border-color: rgba(255,0,0,0.35); box-shadow: 0 0 8px rgba(255,0,0,0.2); }
            .capture-counter.lit .counter-num   { color: #ff4444; text-shadow: 0 0 8px rgba(255,68,68,0.7); }

            .btn-capturar {
                display: flex; align-items: center; gap: 6px;
                background: rgba(0,0,0,0.4); border-radius: 8px;
                padding: 6px 12px;
                border: 1px solid rgba(255,255,255,0.2);
                font-family: 'Press Start 2P', monospace;
                font-size: 0.38rem; color: rgba(255,255,255,0.7);
                cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
                flex-shrink: 0; white-space: nowrap;
            }
            .btn-capturar:hover:not(:disabled) {
                border-color: #ff0; color: #ff0;
                background: rgba(255,255,0,0.08);
                box-shadow: 0 0 8px rgba(255,255,0,0.4);
            }
            .btn-capturar:disabled {
                border-color: #00f7ff; color: #00f7ff;
                background: rgba(0,247,255,0.08);
                box-shadow: 0 0 6px rgba(0,247,255,0.3);
                cursor: not-allowed;
            }
            .btn-capturar .cap-icon { font-size: 0.75rem; line-height: 1; }

            .radar-wrap {
                flex: 1;
                display: flex; align-items: center; justify-content: center;
                min-height: 0;
            }
            .radar-canvas { display: block; width: 190px; height: 175px; }

            .pagination-wrapper {
                display: flex; justify-content: center; align-items: center;
                flex-wrap: wrap; gap: 14px; margin-top: 40px;
            }
            .page-btn {
                font-family: 'Press Start 2P', monospace; font-size: 0.6rem;
                padding: 10px 16px; background: transparent;
                border: 2px solid #fff; color: #fff;
                border-radius: 8px; text-decoration: none; transition: all 0.2s ease;
            }
            .page-btn:hover { background: #fff; color: #000; box-shadow: 0 0 12px rgba(255,255,255,0.5); }
            .page-info { font-size: 0.6rem; color: #aaa; padding: 10px 16px; border: 2px solid #333; border-radius: 8px; }
            .page-jump { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
            .page-jump label { font-size: 0.5rem; color: #aaa; }
            .page-jump input {
                width: 70px; height: 38px; background: #0d0d1a;
                border: 2px solid #444; border-radius: 8px; color: #fff;
                font-family: 'Press Start 2P', monospace; font-size: 0.6rem;
                text-align: center; outline: none;
            }
            .page-jump input:focus { border-color: #ff0; box-shadow: 0 0 8px rgba(255,255,0,0.4); }
            .page-jump input.input-error { border-color: #f66; }
            .page-jump input:disabled, .page-jump button:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
            .page-jump button {
                height: 38px; padding: 0 12px; background: transparent;
                border: 2px solid #ff0; color: #ff0;
                font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
                border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            }
            .page-jump button:not(:disabled):hover { background: #ff0; color: #000; }
            .error-msg { font-size: 0.45rem; color: #f66; display: none; width: 100%; }

            @media (max-width: 600px) {
                .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
                .card-container { height: 290px; }
            }
        </style>
    </head>
    <body>

        <nav class="navbar-retro">
            <div sec:authorize="hasRole('Administrador')"
                 style="display:flex; flex-direction:row; gap:10px; align-items:center;">
                <a th:href="@{/usuarios/admin}" class="nav-custom-btn fav-btn-style"
                   style="border-color:#e63946; color:#e63946; box-shadow:0 0 10px rgba(230,57,70,0.3);">
                    &#x2699; ADMIN PANEL
                </a>
                <a th:href="@{/pokemon/ranking}" class="nav-custom-btn fav-btn-style">
                    &#x1F3C6; RANKING
                </a>
            </div>
            <div sec:authorize="hasRole('Usuario')">
                <a th:href="@{/pokemon/favoritos}" class="nav-custom-btn fav-btn-style">
                    &#x2665; FAVORITOS
                </a>
            </div>
            <span style="font-size:0.5rem; color:#aaa; letter-spacing:2px;"
                  sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="logout-btn">&#x23FB; SALIR</button>
            </form>
        </nav>

        <div class="header">
            <h1 onclick="window.location.href='/pokemon'">&#x25B6; POKÉDEX</h1>
        </div>

        <div class="filters-bar">
            <form th:action="@{/pokemon}" method="get"
                  style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; width:100%;">
                <input type="hidden" name="limit"  th:value="${limit}"/>
                <input type="hidden" name="offset" value="0"/>
                <label>BUSCAR</label>
                <input type="text" name="query" class="search-input"
                       th:value="${currentQuery}" placeholder="ej: bulba" autocomplete="off"/>
                <label>TIPO</label>
                <select name="type">
                    <option value="">— Todos —</option>
                    <option th:each="tipo : ${tipos}" th:value="${tipo.name}"
                            th:selected="${tipo.name == currentType}" th:text="${tipo.name}"></option>
                </select>
                <label>REGIÓN</label>
                <select name="region">
                    <option value="">— Todas —</option>
                    <option value="kanto"  th:selected="${'kanto'  == currentRegion}">Kanto  (Gen 1)</option>
                    <option value="johto"  th:selected="${'johto'  == currentRegion}">Johto  (Gen 2)</option>
                    <option value="hoenn"  th:selected="${'hoenn'  == currentRegion}">Hoenn  (Gen 3)</option>
                    <option value="sinnoh" th:selected="${'sinnoh' == currentRegion}">Sinnoh (Gen 4)</option>
                    <option value="unova"  th:selected="${'unova'  == currentRegion}">Unova  (Gen 5)</option>
                    <option value="kalos"  th:selected="${'kalos'  == currentRegion}">Kalos  (Gen 6)</option>
                    <option value="alola"  th:selected="${'alola'  == currentRegion}">Alola  (Gen 7)</option>
                    <option value="galar"  th:selected="${'galar'  == currentRegion}">Galar  (Gen 8)</option>
                </select>
                <button type="submit" class="filter-bar-btn apply">APLICAR</button>
                <button type="button" class="filter-bar-btn clear"
                        onclick="window.location.href='/pokemon?limit=20&offset=0'">LIMPIAR</button>
            </form>
        </div>

        <div class="filter-chips"
             th:if="${(currentQuery != null and !#strings.isEmpty(currentQuery)) or
                     (currentType   != null and !#strings.isEmpty(currentType))   or
                     (currentRegion != null and !#strings.isEmpty(currentRegion))}">
            <span class="chip" th:if="${currentQuery != null and !#strings.isEmpty(currentQuery)}"
                  onclick="removeFilter('query')">
                Contiene: <span th:text="${currentQuery}"></span> ✕
            </span>
            <span class="chip" th:if="${currentType != null and !#strings.isEmpty(currentType)}"
                  onclick="removeFilter('type')">
                Tipo: <span th:text="${currentType}"></span> ✕
            </span>
            <span class="chip" th:if="${currentRegion != null and !#strings.isEmpty(currentRegion)}"
                  onclick="removeFilter('region')">
                Región: <span th:text="${currentRegion}"></span> ✕
            </span>
        </div>

        <div th:if="${result.Correct == false}"
             style="text-align:center; color:#f66; font-size:0.7rem; max-width:800px; margin:0 auto 40px;">
            <p th:text="${result.ErrorMessage}"></p>
        </div>

        <div class="grid" th:if="${result.Correct == true}">
            <div class="card-container" th:each="pokemon : ${result.Objects}">
                <div class="card-inner">

                    <div class="card-face card-front">
                        <div class="front-top">
                            <div class="poke-name" th:text="${pokemon.name}"></div>
                            <div class="poke-id"   th:text="'#' + ${#numbers.formatInteger(pokemon.id, 3)}"></div>
                        </div>
                        <div class="front-sprite">
                            <img th:if="${pokemon.sprites != null}"
                                 th:src="${pokemon.sprites.frontDefault}"
                                 th:alt="${pokemon.name}"
                                 th:data-id="${pokemon.id}"
                                 onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+this.getAttribute('data-id')+'.png';"
                                 alt="pokemon">
                            <a class="btn-detail-front"
                               th:href="@{/pokemon/{name}(name=${pokemon.name})}"
                               onclick="event.stopPropagation()">
                                VER &#x2192;
                            </a>
                        </div>
                        <div class="front-bottom">
                            <div class="poke-types">
                                <span class="type-badge"
                                      th:each="t : ${pokemon.types}"
                                      th:text="${t.type.name}"></span>
                            </div>
                            <div class="hp-hearts"
                                 th:if="${pokemon.stats != null}"
                                 th:data-hp="${pokemon.stats[0].baseStat}">
                                <span class="hp-hearts-label">HP</span>
                                <div class="hearts-row">
                                    <span class="heart">♥</span>
                                    <span class="heart">♥</span>
                                    <span class="heart">♥</span>
                                    <span class="heart">♥</span>
                                    <span class="heart">♥</span>
                                </div>
                            </div>
                        </div>
                        <span class="tipo-bg-data" style="display:none"
                              th:text="${@pokeApiController.obtenerTipo(pokemon)}"></span>
                    </div>

                    <div class="card-face card-back">
                        <div class="back-header">
                            <div class="back-title" th:text="${pokemon.name}"></div>

                            <div class="capture-counter"
                                 sec:authorize="hasRole('Administrador')"
                                 th:data-count="${conteos[pokemon.id.toString()] ?: 0}">
                                <svg class="pokeball-icon" xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 16 16" style="image-rendering:pixelated; shape-rendering:crispEdges;">
                                    <g fill="#000000">
                                        <rect x="5" y="0" width="6" height="1"/>
                                        <rect x="3" y="1" width="2" height="1"/>
                                        <rect x="11" y="1" width="2" height="1"/>
                                        <rect x="2" y="2" width="1" height="1"/>
                                        <rect x="13" y="2" width="1" height="1"/>
                                        <rect x="1" y="3" width="1" height="2"/>
                                        <rect x="14" y="3" width="1" height="2"/>
                                        <rect x="0" y="5" width="1" height="2"/>
                                        <rect x="15" y="5" width="1" height="2"/>
                                        <rect x="0" y="9" width="1" height="2"/>
                                        <rect x="15" y="9" width="1" height="2"/>
                                        <rect x="1" y="11" width="1" height="2"/>
                                        <rect x="14" y="11" width="1" height="2"/>
                                        <rect x="2" y="13" width="1" height="1"/>
                                        <rect x="13" y="13" width="1" height="1"/>
                                        <rect x="3" y="14" width="2" height="1"/>
                                        <rect x="11" y="14" width="2" height="1"/>
                                        <rect x="5" y="15" width="6" height="1"/>
                                        <rect x="0" y="7" width="7" height="2"/>
                                        <rect x="9" y="7" width="7" height="2"/>
                                        <rect x="6" y="6" width="4" height="1"/>
                                        <rect x="6" y="9" width="4" height="1"/>
                                    </g>
                                    <g fill="#E3350D">
                                        <rect x="5" y="1" width="6" height="1"/>
                                        <rect x="3" y="2" width="1" height="1"/>
                                        <rect x="6" y="2" width="7" height="1"/>
                                        <rect x="5" y="3" width="9" height="1"/>
                                        <rect x="2" y="3" width="1" height="1"/>
                                        <rect x="3" y="4" width="11" height="1"/>
                                        <rect x="1" y="5" width="14" height="1"/>
                                        <rect x="1" y="6" width="5" height="1"/>
                                        <rect x="10" y="6" width="5" height="1"/>
                                    </g>
                                    <g fill="#FF9999">
                                        <rect x="4" y="2" width="2" height="1"/>
                                        <rect x="3" y="3" width="2" height="1"/>
                                        <rect x="2" y="4" width="1" height="1"/>
                                    </g>
                                    <g fill="#FFFFFF">
                                        <rect x="1" y="9" width="5" height="1"/>
                                        <rect x="10" y="9" width="3" height="1"/>
                                        <rect x="1" y="10" width="11" height="1"/>
                                        <rect x="2" y="11" width="9" height="1"/>
                                        <rect x="2" y="12" width="8" height="1"/>
                                        <rect x="3" y="13" width="6" height="1"/>
                                        <rect x="5" y="14" width="2" height="1"/>
                                        <rect x="7" y="7" width="2" height="2"/>
                                    </g>
                                    <g fill="#D0D4D8">
                                        <rect x="13" y="9" width="2" height="1"/>
                                        <rect x="12" y="10" width="3" height="1"/>
                                        <rect x="11" y="11" width="3" height="1"/>
                                        <rect x="10" y="12" width="4" height="1"/>
                                        <rect x="9" y="13" width="4" height="1"/>
                                        <rect x="7" y="14" width="4" height="1"/>
                                    </g>
                                    <g fill="#DDDDDD"><rect x="8" y="8" width="1" height="1"/></g>
                                </svg>
                                <span class="counter-label">CAPTURAS</span>
                                <span class="counter-num"
                                      th:text="${conteos[pokemon.id.toString()] ?: 0}"></span>
                            </div>

                            <button sec:authorize="hasRole('Usuario')"
                                    type="button" class="btn-capturar"
                                    th:data-id="${pokemon.id}"
                                    th:disabled="${Favoritos.contains(pokemon.id.toString())}"
                                    onclick="event.stopPropagation(); agregarFavorito(this)">
                                <span class="cap-icon"
                                      th:text="${Favoritos.contains(pokemon.id.toString()) ? '★' : '☆'}"></span>
                                <span th:text="${Favoritos.contains(pokemon.id.toString()) ? 'EN EQUIPO' : 'CAPTURAR'}"></span>
                            </button>
                        </div>

                        <div class="radar-wrap">
                            <canvas class="radar-canvas"
                                    th:if="${pokemon.stats != null}"
                                    th:attr="data-stats=${pokemon.stats[0].baseStat + ',' +
                                                          pokemon.stats[1].baseStat + ',' +
                                                          pokemon.stats[2].baseStat + ',' +
                                                          pokemon.stats[3].baseStat + ',' +
                                                          pokemon.stats[4].baseStat + ',' +
                                                          pokemon.stats[5].baseStat},
                                             data-tipo=${pokemon.types[0].type.name}">
                            </canvas>
                        </div>

                        <input type="hidden" class="idUsuarioLogueado" th:value="${UsuarioL.idUsuario}"/>
                    </div>

                </div>
            </div>
        </div>

        <div class="pagination-wrapper" th:if="${result.Correct == true}">
            <a class="page-btn"
               th:if="${currentOffset > 0}"
               th:href="@{/pokemon(limit=${limit}, offset=${currentOffset - limit}, query=${currentQuery}, type=${currentType}, region=${currentRegion})}">
                ← ANTERIOR
            </a>
            <span class="page-info">
                PÁG. <span th:text="${(currentOffset / limit) + 1}"></span>
                / <span th:text="${totalPages}"></span>
            </span>
            <a class="page-btn"
               th:if="${#lists.size(result.Objects) >= limit}"
               th:href="@{/pokemon(limit=${limit}, offset=${currentOffset + limit}, query=${currentQuery}, type=${currentType}, region=${currentRegion})}">
                SIGUIENTE →
            </a>
            <form class="page-jump" id="jumpForm" th:action="@{/pokemon}" method="get">
                <input type="hidden" name="limit"  th:value="${limit}"/>
                <input type="hidden" name="query"  th:value="${currentQuery}"/>
                <input type="hidden" name="type"   th:value="${currentType}"/>
                <input type="hidden" name="region" th:value="${currentRegion}"/>
                <label>IR A</label>
                <input type="text" id="pageInput" name="page" placeholder="Pág." maxlength="4"
                       th:value="${(currentOffset / limit) + 1}"
                       th:attr="data-max=${totalPages}"
                       th:disabled="${#lists.size(result.Objects) < limit}"/>
                <button type="submit" th:disabled="${#lists.size(result.Objects) < limit}">OK</button>
                <span class="error-msg" id="pageError"></span>
            </form>
        </div>

        <script>
            var TIPO_COLOR = {
                fire:'#f08030', water:'#6890f0', grass:'#78c850', electric:'#f8d030',
                normal:'#a8a878', fighting:'#c03028', poison:'#a040a0', ground:'#e0c068',
                flying:'#a890f0', psychic:'#f85888', bug:'#a8b820', rock:'#b8a038',
                ghost:'#705898', dragon:'#7038f8', steel:'#b8b8d0', fairy:'#ee99ac',
                dark:'#705848', ice:'#98d8d8'
            };

            function hexToRgba(hex, alpha) {
                var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
                return 'rgba('+r+','+g+','+b+','+alpha+')';
            }

            function iniciarFlip() {
                var cards = document.querySelectorAll('.card-container');
                for (var i = 0; i < cards.length; i++) {
                    var c = cards[i];
                    c._flipped  = false;
                    c._flipping = false;
                    c._tiltX    = 0;
                    c._raf      = null;

                    var inner = c.querySelector('.card-inner');
                    inner.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
                    c.querySelector('.card-front').style.visibility = 'visible';
                    c.querySelector('.card-back').style.visibility  = 'hidden';

                    c.addEventListener('mousedown',  onMouseDown);
                    c.addEventListener('mouseup',    onMouseUp);
                    c.addEventListener('mousemove',  onTiltMove);
                    c.addEventListener('mouseleave', onTiltLeave);
                }
            }

            function onMouseDown(e) { this._mdownX = e.clientX; this._mdownY = e.clientY; }

            function onMouseUp(e) {
                if (e.target.closest('.btn-detail-front') || e.target.closest('.btn-capturar')) return;
                if (Math.abs(e.clientX-this._mdownX)>6 || Math.abs(e.clientY-this._mdownY)>6) return;
                if (this._flipping) return;
                ejecutarFlip(this);
            }

            function ejecutarFlip(card) {
                card._flipping = true;
                card._flipped  = !card._flipped;

                var inner  = card.querySelector('.card-inner');
                var front  = card.querySelector('.card-front');
                var back   = card.querySelector('.card-back');
                var fromY  = card._flipped ? 0   : 180;
                var toY    = card._flipped ? 180 : 0;
                var dur    = 600;
                var start  = null;
                var midDone = false;

                function animate(ts) {
                    if (!start) start = ts;
                    var p = Math.min((ts - start) / dur, 1);
                    var t = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
                    var curY = fromY + (toY - fromY) * t;

                    inner.style.transform =
                        'perspective(900px) rotateX('+card._tiltX+'deg) rotateY('+curY+'deg)';

                    if (!midDone && p >= 0.5) {
                        midDone = true;
                        if (card._flipped) {
                            front.style.visibility = 'hidden';
                            back.style.visibility  = 'visible';
                        } else {
                            back.style.visibility  = 'hidden';
                            front.style.visibility = 'visible';
                        }
                    }

                    if (p < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        card._flipping = false;
                    }
                }
                requestAnimationFrame(animate);
            }

            function onTiltMove(e) {
                var card = this;
                var rect = card.getBoundingClientRect();
                var ry   = ((e.clientX - rect.left  - rect.width/2)  / (rect.width/2))  * 18;
                var rx   = -((e.clientY - rect.top  - rect.height/2) / (rect.height/2)) * 18;
                card._tiltX = rx;
                if (card._raf) cancelAnimationFrame(card._raf);
                card._raf = requestAnimationFrame(function() {
                    if (card._flipping) return;
                    var inner = card.querySelector('.card-inner');
                    inner.style.transition = 'none';
                    inner.style.transform  =
                        'perspective(900px) rotateX('+rx+'deg) rotateY('+((card._flipped?180:0)+ry)+'deg)';
                    var img = card.querySelector('.front-sprite img');
                    if (img && !card._flipped) {
                        var b = 1+(Math.abs(rx)+Math.abs(ry))*0.006;
                        img.style.filter = 'drop-shadow(0px 8px 10px rgba(0,0,0,0.7)) brightness('+b+')';
                    }
                });
            }

            function onTiltLeave(e) {
                var card  = this;
                var inner = card.querySelector('.card-inner');
                if (card._raf) { cancelAnimationFrame(card._raf); card._raf = null; }
                if (card._flipping) return;
                card._tiltX = 0;
                inner.style.transition = 'transform 0.4s ease';
                inner.style.transform  =
                    'perspective(900px) rotateX(0deg) rotateY('+(card._flipped?180:0)+'deg)';
                var img = card.querySelector('.front-sprite img');
                if (img) img.style.filter = 'drop-shadow(0px 8px 10px rgba(0,0,0,0.7))';
            }

            function dibujarRadarCanvas(canvas) {
                var raw   = canvas.getAttribute('data-stats');
                var tipo  = canvas.getAttribute('data-tipo') || '';
                var color = TIPO_COLOR[tipo] || '#ff0';
                if (!raw) return;
                var values = raw.split(',').map(function(v){ return parseInt(v.trim(),10)||0; });

                var W = 190, H = 175;
                var dpr = window.devicePixelRatio || 1;
                canvas.width  = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width  = W + 'px';
                canvas.style.height = H + 'px';

                var ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);

                var labels = ['HP','ATK','DEF','SpA','SpD','SPD'];
                var n = 6, cx = W/2, cy = H/2;

                var radius = 56;
                var labelR = radius + 20;
                var maxVal = 255;

                ctx.clearRect(0, 0, W, H);

                for (var lvl=1; lvl<=4; lvl++) {
                    var r = radius*(lvl/4);
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
                    for (var i=0; i<n; i++) {
                        var a = (Math.PI*2/n)*i - Math.PI/2;
                        var px = cx + r*Math.cos(a), py = cy + r*Math.sin(a);
                        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
                    }
                    ctx.closePath(); ctx.stroke();
                }
                for (var i=0; i<n; i++) {
                    var a = (Math.PI*2/n)*i - Math.PI/2;
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx+radius*Math.cos(a), cy+radius*Math.sin(a));
                    ctx.stroke();
                }
                ctx.beginPath();
                for (var i=0; i<n; i++) {
                    var a   = (Math.PI*2/n)*i - Math.PI/2;
                    var val = Math.min(values[i], maxVal);
                    var r   = radius*(val/maxVal);
                    var px  = cx+r*Math.cos(a), py = cy+r*Math.sin(a);
                    i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
                }
                ctx.closePath();
                ctx.fillStyle = hexToRgba(color, 0.3); ctx.fill();
                ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();

                for (var i=0; i<n; i++) {
                    var a   = (Math.PI*2/n)*i - Math.PI/2;
                    var val = Math.min(values[i], maxVal);
                    var r   = radius*(val/maxVal);
                    ctx.beginPath();
                    ctx.arc(cx+r*Math.cos(a), cy+r*Math.sin(a), 2.5, 0, Math.PI*2);
                    ctx.fillStyle = color; ctx.fill();
                }

                for (var i=0; i<n; i++) {
                    var a  = (Math.PI*2/n)*i - Math.PI/2;
                    var lx = cx + labelR*Math.cos(a);
                    var ly = cy + labelR*Math.sin(a);

                    ctx.font = 'bold 7px "Press Start 2P",monospace';
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(labels[i], lx, ly - 6);

                    ctx.font = 'bold 6.5px "Press Start 2P",monospace';
                    ctx.fillStyle = color;
                    ctx.fillText(values[i], lx, ly + 6);
                }
            }

            function iniciarRadares() {
                requestAnimationFrame(function(){
                    var canvases = document.querySelectorAll('.radar-canvas');
                    for (var i=0; i<canvases.length; i++) dibujarRadarCanvas(canvases[i]);
                });
            }

            function aplicarFondosTipo() {
                var cards = document.querySelectorAll('.card-container');
                for (var i=0; i<cards.length; i++) {
                    var span = cards[i].querySelector('.tipo-bg-data');
                    var front = cards[i].querySelector('.card-front');
                    if (span && front) front.style.background = span.textContent.trim();
                }
            }

            function colorearTipos() {
                var badges = document.querySelectorAll('.type-badge');
                for (var i=0; i<badges.length; i++) {
                    var tipo  = badges[i].textContent.trim().toLowerCase();
                    var color = TIPO_COLOR[tipo] || '#888';
                    badges[i].style.background = color;
                    badges[i].style.boxShadow  = '0 0 8px '+hexToRgba(color,0.55);
                }
            }

            function pintarCorazones() {
                var hpDivs = document.querySelectorAll('.hp-hearts');
                for (var i=0; i<hpDivs.length; i++) {
                    var div    = hpDivs[i];
                    var hp     = parseInt(div.getAttribute('data-hp'))||0;
                    var llenos = Math.min(Math.round(hp/51), 5);
                    var color  = hp>=180?'#ff0':hp>=100?'#ff8c00':'#ff4444';
                    var hearts = div.querySelectorAll('.heart');
                    for (var j=0; j<hearts.length; j++) {
                        hearts[j].style.color = color;
                        hearts[j].classList.toggle('full',  j<llenos);
                        hearts[j].classList.toggle('empty', j>=llenos);
                    }
                }
            }

            function colorearBtnCapturar() {
                var btns = document.querySelectorAll('.btn-capturar:not(:disabled)');
                for (var i=0; i<btns.length; i++) {
                    var card   = btns[i].closest('.card-container');
                    var canvas = card ? card.querySelector('.radar-canvas') : null;
                    var tipo   = canvas ? canvas.getAttribute('data-tipo') : '';
                    var color  = TIPO_COLOR[tipo] || '#ff0';
                    btns[i].style.borderColor = hexToRgba(color, 0.6);
                    btns[i].style.color       = hexToRgba(color, 0.9);
                    btns[i].setAttribute('data-color', color);
                }
            }

            function iniciarContadores() {
                var counters = document.querySelectorAll('.capture-counter');
                for (var i=0; i<counters.length; i++) {
                    var count = parseInt(counters[i].getAttribute('data-count'))||0;
                    counters[i].classList.add(count===0?'dim':'lit');
                }
            }

            function configurarPaginacion() {
                var pageInput = document.getElementById('pageInput');
                var pageError = document.getElementById('pageError');
                var jumpForm  = document.getElementById('jumpForm');
                if (!pageInput || pageInput.disabled) return;
                pageInput.addEventListener('keypress', function(e){ if(!/[0-9]/.test(e.key)) e.preventDefault(); });
                pageInput.addEventListener('input', function(){ this.value=this.value.replace(/[^0-9]/g,''); });
                jumpForm.addEventListener('submit', function(e){
                    var val     = parseInt(pageInput.value.trim(), 10);
                    var maxPage = parseInt(pageInput.getAttribute('data-max')||'9999', 10);
                    if (!val||val<1||val>maxPage) {
                        e.preventDefault();
                        pageInput.classList.add('input-error');
                        pageError.textContent   = (val>maxPage)?'Max: pag. '+maxPage:'Solo numeros';
                        pageError.style.display = 'block';
                        setTimeout(function(){ pageInput.classList.remove('input-error'); pageError.style.display='none'; }, 2500);
                        return;
                    }
                    var lim = parseInt(jumpForm.querySelector('input[name="limit"]').value)||20;
                    var inp = document.createElement('input');
                    inp.type='hidden'; inp.name='offset'; inp.value=(val-1)*lim;
                    jumpForm.appendChild(inp);
                });
            }

            function agregarFavorito(btn) {
                var pokemonId = btn.getAttribute('data-id');
                var idUsuario = btn.closest('.card-back').querySelector('.idUsuarioLogueado').value;
                var sonido    = new Audio('https://www.myinstants.com/media/sounds/pokemon-capture.mp3');
                fetch('/favorito/add', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ usuario:{idUsuario:parseInt(idUsuario)}, pokemon:parseInt(pokemonId) })
                })
                .then(function(r){ return r.json(); })
                .then(function(data){
                    if (data.Correct) {
                        sonido.play().catch(function(e){ console.warn('Audio bloqueado',e); });
                        Swal.fire({ icon:'success', title:'¡Capturado!', text:data.Object,
                            confirmButtonColor:'#3085d6', confirmButtonText:'Aceptar'
                        }).then(function(){ location.reload(); });
                    } else { Swal.fire({ icon:'error', title:'Error', text:data.Object }); }
                })
                .catch(function(){ Swal.fire({ icon:'error', title:'Error de conexión', text:'No se pudo conectar con el servidor' }); });
            }

            function removeFilter(param) {
                var url = new URL(window.location.href);
                url.searchParams.delete(param);
                window.location.href = url.toString();
            }

            document.addEventListener('DOMContentLoaded', function() {
                aplicarFondosTipo();
                colorearTipos();
                pintarCorazones();
                iniciarRadares();
                colorearBtnCapturar();
                iniciarFlip();
                iniciarContadores();
                configurarPaginacion();
            });
        </script>
    </body>
</html>
