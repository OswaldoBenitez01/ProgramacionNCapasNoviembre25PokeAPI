<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #1b1b2f;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #161625;
            border: 4px solid #ff0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.2);
        }
        .header {
            background-color: #232344;
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 {
            color: #ff0;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 2px 2px #f80;
            font-size: 24px;
        }
        .content {
            padding: 40px 30px;
            line-height: 1.6;
            text-align: center;
        }
        .user-name {
            color: #20c997;
            font-weight: bold;
            font-size: 18px;
        }
        .message {
            margin: 20px 0;
            color: #ccc;
            font-size: 14px;
        }
        .btn-container {
            margin-top: 35px;
        }
        .btn-reset {
            background-color: #ff0;
            color: #000;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            display: inline-block;
            box-shadow: 4px 4px 0 #f80;
            transition: transform 0.2s;
        }
        .footer {
            padding: 20px;
            background-color: #0d0d1a;
            text-align: center;
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
        }
        .warning {
            color: #f66;
            font-size: 11px;
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SISTEMA DE RECUPERACIÓN</h1>
        </div>

        <div class="content">
            <p>¡Hola, <span class="user-name" th:text="${username}">Entrenador</span>!</p>
            
            <p class="message">
                Hemos recibido una solicitud para restablecer el acceso a tu Pokédex. 
                Si no has sido tú, puedes ignorar este mensaje.
            </p>

            <div class="btn-container">
                <a th:href="${resetUrl}" class="btn-reset">
                    REESTABLECER CONTRASEÑA
                </a>
            </div>

            <p class="warning">
                Este enlace expirará pronto. Por seguridad, no compartas este correo con nadie.
            </p>
        </div>

    </div>
</body>
</html>
